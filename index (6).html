<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>Game Factory v1.0</title>
<!-- Supabase JS SDK v2 (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; background: none; border: none; outline: none; }
ol, ul, dl { list-style: none; }
:root {
  /* Play Store 스타일 라이트 테마 */
  --bg: #F8F9FA;              /* 페이지 배경 */
  --surface: #FFFFFF;          /* 카드 배경 */
  --surface-2: #F1F3F4;        /* 보조 표면 (입력창 등) */
  --fg: #202124;               /* 본문 텍스트 */
  --fg-muted: #5F6368;         /* 보조 텍스트 */
  --fg-subtle: #80868B;        /* 더 흐린 텍스트 */
  --accent: #1A73E8;           /* Google Blue */
  --accent-hover: #1557B0;
  --accent-soft: #E8F0FE;      /* 액센트 배경용 */
  --danger: #D93025;
  --warning: #F9AB00;
  --success: #1E8E3E;
  --border: #DADCE0;           /* 테두리 */
  --border-soft: #E8EAED;      /* 부드러운 구분선 */
  --shadow-sm: 0 1px 2px rgba(60,64,67,0.08), 0 1px 3px rgba(60,64,67,0.06);
  --shadow-md: 0 1px 3px rgba(60,64,67,0.10), 0 4px 8px rgba(60,64,67,0.10);
  --shadow-lg: 0 2px 6px rgba(60,64,67,0.12), 0 8px 16px rgba(60,64,67,0.14);
  --max-w: 100%; --pad: 16px; --radius: 16px; --cta-h: 52px; --hdr-h: 60px;
  --content-max: 760px; /* 본문 가독성용 */
  --gallery-max: 1180px; /* 갤러리 그리드용 */
  --play-max: 1280px; /* 플레이 화면용 */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-mono: "SF Mono", Menlo, Consolas, "Courier New", monospace;
}
body { font-family:var(--font); font-size:15px; line-height:1.5; color:var(--fg); background:var(--bg);
  -webkit-font-smoothing:antialiased; touch-action:manipulation; overscroll-behavior-y:contain; }
.gf-app { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; width:100%; max-width:var(--max-w); margin:0 auto; background:var(--bg); }
/* 본문 폭 제어 - 화면별 컨테이너 */
.gf-content-wrap { width:100%; margin:0 auto; }
.gf-content-narrow { max-width:var(--content-max); }
.gf-content-gallery { max-width:var(--gallery-max); }
.gf-content-play { max-width:var(--play-max); }

/* 헤더 */
.gf-header { height:var(--hdr-h); padding:0 var(--pad); display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:rgba(255,255,255,0.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); z-index:10; }
.gf-header-inner { width:100%; max-width:var(--gallery-max); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.gf-title { font-size:18px; font-weight:600; letter-spacing:-0.3px; color:var(--fg); }
.gf-title .accent { color:var(--accent); font-weight:700; }
.gf-title .ver { font-size:11px; color:var(--fg-subtle); margin-left:6px; font-weight:400; }
.gf-progress { display:flex; gap:4px; flex:1; justify-content:center; }
.gf-progress .dot { width:6px; height:6px; border-radius:50%; background:var(--border); transition:background 0.2s; }
.gf-progress .dot.active { background:var(--accent); }

/* 메인 */
.gf-main { flex:1; padding:var(--pad); padding-bottom:calc(var(--cta-h) + var(--pad) * 2); overflow-y:auto; width:100%; margin:0 auto; }
.gf-main-narrow { max-width:var(--content-max); }
.gf-main-wide { max-width:var(--gallery-max); }
.gf-main-play { max-width:var(--play-max); padding:var(--pad); }

/* 일반 카드 */
.gf-card { background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px; margin-bottom:10px; box-shadow:var(--shadow-sm); }
.gf-card h2 { font-size:22px; margin-bottom:6px; letter-spacing:-0.4px; font-weight:700; }
.gf-card h3 { font-size:18px; margin-bottom:6px; letter-spacing:-0.3px; font-weight:700; }
.gf-card h4 { font-size:15px; margin-bottom:10px; letter-spacing:-0.2px; font-weight:600; }
.gf-card p { color:var(--fg-muted); font-size:14px; }
.gf-card.gf-highlight { border-color:var(--accent); background:var(--accent-soft); box-shadow:none; }
.gf-card.gf-info { background:transparent; border:none; box-shadow:none; padding:8px 4px; margin-bottom:8px; }
.gf-muted { color:var(--fg-muted); font-size:13px; }
.gf-spacer-sm { height:8px; } .gf-spacer { height:14px; }

/* 입력 */
.gf-input, .gf-textarea { width:100%; padding:13px 14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--fg); font-size:15px; resize:vertical; transition:border-color 0.15s, box-shadow 0.15s; }
.gf-input:focus, .gf-textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none; }
.gf-textarea { min-height:80px; font-family:inherit; }
label { display:block; font-size:12px; color:var(--fg-muted); margin-bottom:6px; font-weight:500; }

/* 라디오 */
.gf-radio-group { display:flex; flex-direction:column; gap:8px; }
.gf-radio-card { padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; font-size:14px; display:flex; align-items:flex-start; gap:12px; min-height:48px; transition:all 0.15s; user-select:none; cursor:pointer; }
.gf-radio-card::before { content:""; width:18px; height:18px; border:2px solid var(--border); border-radius:50%; flex-shrink:0; margin-top:2px; transition:all 0.15s; }
.gf-radio-card.selected { border-color:var(--accent); background:var(--accent-soft); }
.gf-radio-card.selected::before { border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 3px var(--surface); }
.gf-radio-card .star { margin-left:auto; color:var(--accent); font-size:11px; font-weight:600; }

/* Genre Grid */
.gf-genre-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
.gf-genre-card { padding:14px 12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; text-align:center; min-height:108px; display:flex; flex-direction:column; justify-content:center; gap:4px; cursor:pointer; transition:all 0.15s; }
.gf-genre-card:active { transform:scale(0.98); }
.gf-genre-card.recommended { grid-column:1 / -1; border-color:var(--accent); background:var(--accent-soft); min-height:auto; padding:18px 16px; text-align:left; flex-direction:row; align-items:center; gap:14px; }
.gf-genre-card.recommended .icon { font-size:36px; flex-shrink:0; }
.gf-genre-card.recommended .info { flex:1; text-align:left; }
.gf-genre-card.selected { border-color:var(--accent); background:var(--accent-soft); }
.gf-genre-card .icon { font-size:24px; }
.gf-genre-card .name { font-size:13px; font-weight:600; line-height:1.3; color:var(--fg); }
.gf-genre-card.recommended .name { font-size:16px; }
.gf-genre-card .examples { font-size:11px; color:var(--fg-muted); line-height:1.3; }
.gf-genre-card.recommended .examples { font-size:12px; }
.gf-genre-card .badge { font-size:10px; color:var(--accent); font-weight:600; margin-bottom:4px; }
.gf-genre-grid-others-label { font-size:13px; color:var(--fg-muted); margin:14px 0 6px; }

/* Tabs */
.gf-tabs { display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:12px; margin-bottom:10px; }
.gf-tabs button { flex:1; padding:9px; border-radius:8px; font-size:13px; color:var(--fg-muted); font-weight:500; cursor:pointer; }
.gf-tabs button.active { background:var(--surface); color:var(--fg); box-shadow:var(--shadow-sm); }

/* 출력창 */
.gf-output { width:100%; min-height:240px; max-height:50vh; padding:14px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:12px; font-family:var(--font-mono); font-size:12px; line-height:1.55; color:var(--fg); overflow-y:auto; white-space:pre-wrap; word-break:break-word; user-select:all; -webkit-user-select:all; }

/* 액션 버튼 */
.gf-actions { display:flex; gap:8px; margin-top:10px; margin-bottom:12px; }
.gf-btn-secondary { flex:1; padding:11px; background:var(--surface); border:1px solid var(--border); border-radius:10px; font-size:14px; font-weight:500; min-height:44px; color:var(--fg); transition:all 0.15s; cursor:pointer; }
.gf-btn-secondary:active { background:var(--surface-2); }
.gf-btn-primary { flex:1; padding:13px; background:var(--accent); color:#fff; border-radius:10px; font-size:14px; font-weight:600; min-height:44px; cursor:pointer; transition:all 0.15s; border:none; }
.gf-btn-primary:active { background:var(--accent-hover); transform:scale(0.99); }
.gf-btn-primary.gf-large { padding:14px; font-size:15px; }

/* Summary */
.gf-summary { display:grid; grid-template-columns:90px 1fr; gap:10px 12px; margin-top:14px; }
.gf-summary dt { color:var(--fg-muted); font-size:13px; }
.gf-summary dd { font-size:14px; color:var(--fg); }

.gf-info ol { list-style:decimal inside; color:var(--fg-muted); font-size:13px; }
.gf-info ol li { padding:4px 0; }
.gf-info h4 { color:var(--fg); margin-bottom:8px; }

/* 하단 CTA */
.gf-cta { position:fixed; bottom:0; left:0; right:0; max-width:var(--content-max); margin:0 auto; padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(to top,var(--bg) 70%,transparent); z-index:10; }
.gf-cta.gf-cta-wide { max-width:var(--gallery-max); }
.gf-cta.gf-cta-play { max-width:var(--play-max); }
.gf-cta-btn { width:100%; height:var(--cta-h); background:var(--accent); color:#fff; border-radius:14px; font-size:15px; font-weight:600; letter-spacing:-0.2px; transition:all 0.15s; cursor:pointer; box-shadow:var(--shadow-md); border:none; }
.gf-cta-btn:active { background:var(--accent-hover); transform:scale(0.99); }
.gf-cta-btn.gf-secondary { background:var(--surface); color:var(--fg); border:1px solid var(--border); box-shadow:var(--shadow-sm); }
.gf-cta-btn[disabled] { opacity:0.4; cursor:not-allowed; box-shadow:none; }

/* 토스트 */
.gf-toast { position:fixed; bottom:calc(var(--cta-h) + 32px); left:50%; transform:translateX(-50%); background:var(--fg); border:none; color:#fff; padding:11px 18px; border-radius:999px; font-size:13px; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s,transform 0.2s; box-shadow:var(--shadow-lg); }
.gf-toast.show { opacity:1; transform:translateX(-50%) translateY(-4px); }

@media (min-width:431px) { .gf-app { border-left:1px solid var(--border-soft); border-right:1px solid var(--border-soft); min-height:100vh; box-shadow:var(--shadow-md); } }


/* ===== v0.4: Mode Cards ===== */
.gf-mode-list { display:flex; flex-direction:column; gap:8px; }
.gf-mode-card { padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; cursor:pointer; transition:all 0.15s; box-shadow:var(--shadow-sm); }
.gf-mode-card:active { transform:scale(0.99); }
.gf-mode-card.selected { border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent-soft); }
.gf-mode-head { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.gf-mode-icon { font-size:24px; flex-shrink:0; }
.gf-mode-titles { flex:1; }
.gf-mode-name { font-size:16px; font-weight:700; color:var(--fg); }
.gf-mode-star { color:var(--accent); font-size:11px; margin-left:6px; font-weight:600; }
.gf-mode-tag { font-size:11px; color:var(--fg-muted); margin-top:2px; }
.gf-mode-desc { font-size:13px; color:var(--fg); margin-bottom:6px; }
.gf-mode-reason { font-size:11px; color:var(--fg-subtle); }

/* ===== v0.4: Question Reason ===== */
.gf-q-reason { font-size:12px; color:var(--accent); margin:-4px 0 12px; line-height:1.4; font-weight:500; }

/* ===== v0.4: Radio Card with Reason ===== */
.gf-radio-card { align-items:flex-start; }
.gf-radio-body { flex:1; display:flex; flex-direction:column; gap:3px; }
.gf-radio-label { font-size:14px; display:flex; align-items:center; gap:8px; color:var(--fg); font-weight:500; }
.gf-radio-label .star { font-size:10px; color:var(--accent); margin-left:auto; font-weight:600; }
.gf-radio-reason { font-size:11px; color:var(--fg-muted); line-height:1.4; }

/* ===== v0.4: Pro Form ===== */
.gf-pro-field { margin-bottom:10px; }
.gf-pro-field label { font-size:12px; color:var(--fg-muted); margin-bottom:4px; }
.gf-pro-input { padding:10px 12px; font-size:14px; }

/* ===== v0.5: Preview Lite ===== */
.gf-preview-lite { padding:22px 18px; }
.gf-preview-row { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-soft); align-items:flex-start; }
.gf-preview-row:last-child { border-bottom:none; }
.gf-preview-label { font-size:12px; color:var(--fg-muted); flex:0 0 80px; padding-top:2px; }
.gf-preview-value { flex:1; font-size:14px; color:var(--fg); line-height:1.5; }
.gf-preview-pro .gf-preview-value { color:var(--accent); font-size:13px; font-weight:500; }
.gf-preview-actions { display:flex; flex-direction:column; gap:8px; padding:0 4px; }
.gf-preview-actions .gf-btn-primary { width:100%; }
.gf-preview-actions .gf-btn-secondary { width:100%; }

/* ===== v0.6: Gallery (홈 화면) — Play Store Style ===== */
.gf-home-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}
.gf-home-btn:active { transform: scale(0.95); background: var(--surface-2); }

/* 갤러리 헤더 */
.gf-gallery-header { padding: 12px 4px 18px; }
.gf-gallery-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
  gap: 10px;
}
.gf-gallery-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.2;
  color: var(--fg);
}
.gf-gallery-count {
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  flex-shrink: 0;
}

/* Featured Row (★ 건우 작품) */
.gf-featured-row { margin-bottom: 14px; }
.gf-game-card.featured {
  position: relative;
  padding: 22px 18px 18px;
  background: linear-gradient(135deg, #E8F0FE 0%, #F8F9FA 100%);
  border: 1.5px solid var(--accent);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 2px 12px rgba(26,115,232,0.12);
  cursor: pointer;
  transition: all 0.15s;
}
.gf-game-card.featured:active { transform: scale(0.99); }
.gf-featured-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  letter-spacing: 0.3px;
}
.gf-featured-emoji {
  font-size: 56px;
  line-height: 1;
  margin-top: 4px;
  text-align: left;
}
.gf-featured-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.4px;
  color: var(--fg);
  margin-top: 2px;
}
.gf-featured-summary {
  font-size: 13px;
  color: var(--fg-muted);
  line-height: 1.5;
}
.gf-game-card.featured .gf-card-meta {
  font-size: 12px;
  margin-top: 4px;
}
.gf-game-card.featured .gf-card-actions {
  margin-top: 6px;
}
.gf-game-card.featured .gf-card-btn {
  padding: 12px 14px;
  font-size: 13px;
  min-height: 44px;
}

/* 일반 카드 그리드 - 반응형 (모바일 2 / 태블릿 3 / PC 4) */
.gf-gallery-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (min-width: 720px) {
  .gf-gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
}
@media (min-width: 980px) {
  .gf-gallery-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
}
.gf-game-card {
  position: relative;
  padding: 14px 12px 12px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.15s;
  min-height: 200px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
}
.gf-game-card:active { transform: scale(0.98); box-shadow: var(--shadow-md); }
.gf-game-card.demo { opacity: 0.78; background: var(--surface-2); }

.gf-demo-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--surface);
  color: var(--fg-muted);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  border: 1px solid var(--border);
}

.gf-card-emoji {
  font-size: 30px;
  line-height: 1;
  margin-bottom: 2px;
}
.gf-card-title {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.2px;
  color: var(--fg);
}
.gf-card-summary {
  font-size: 11px;
  color: var(--fg-muted);
  line-height: 1.4;
  flex: 1;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

/* 카드 메타 */
.gf-card-meta {
  font-size: 11px;
  color: var(--fg-muted);
  margin-top: auto;
  padding-top: 4px;
}
.gf-card-builds { color: var(--accent); font-weight: 600; }
.gf-card-recent { color: var(--fg-subtle); }

/* 카드 액션 */
.gf-card-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.gf-card-btn {
  flex: 1;
  padding: 8px 4px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 8px;
  min-height: 36px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
}
.gf-card-btn-primary {
  background: var(--accent);
  color: #fff;
}
.gf-card-btn-primary:active { background: var(--accent-hover); transform: scale(0.97); }
.gf-card-btn-secondary {
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--border);
}
.gf-card-btn-secondary:active { background: var(--surface-2); }

/* 갤러리 푸터 */
.gf-gallery-footer {
  text-align: center;
  padding: 28px 0 16px;
  color: var(--fg-subtle);
  font-size: 12px;
  letter-spacing: 0.2px;
}

.gf-empty-gallery {
  padding: 60px 20px;
  text-align: center;
}
.gf-empty-gallery p { margin: 8px 0; }

/* ===== v0.6: Upgrade ===== */
.gf-upgrade-target {
  text-align: center;
  padding: 28px 16px;
  background: linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 100%);
  border-radius: var(--radius);
}
.gf-upgrade-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.gf-upgrade-chip {
  padding: 14px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
  min-height: 70px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.gf-upgrade-chip:active { transform: scale(0.97); }
.gf-upgrade-chip.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent);
}
.gf-chip-label {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 4px;
  color: var(--fg);
}
.gf-chip-desc {
  font-size: 10px;
  color: var(--fg-muted);
  line-height: 1.4;
}

/* ===== v0.7: Play & Import ===== */

// ===== STORAGE =====
const storage = {
  save(p) {
    try {
      const list = storage.loadAll();
      const i = list.findIndex(x => x.id === p.id);
      if (i >= 0) list[i] = p; else list.push(p);
      localStorage.setItem(CONFIG.STORAGE.key, JSON.stringify(list));
      return true;
    } catch (e) { console.warn('[storage.save]', e); return false; }
  },
  loadAll() {
    try {
      const r = localStorage.getItem(CONFIG.STORAGE.key);
      if (!r) return [];
      const a = JSON.parse(r);
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  },
  
  // ===== Gallery CRUD (v0.6) =====
  galleryLoad() {
    try {
      const r = localStorage.getItem(CONFIG.STORAGE.galleryKey);
      if (!r) return [];
      const a = JSON.parse(r);
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  },
  gallerySaveAll(cards) {
    try {
      localStorage.setItem(CONFIG.STORAGE.galleryKey, JSON.stringify(cards));
      return true;
    } catch (e) { console.warn('[storage.gallerySaveAll]', e); return false; }
  },
  galleryAddCard(card) {
    try {
      const list = storage.galleryLoad();
      // 중복 id면 업데이트, 아니면 추가
      const i = list.findIndex(c => c.id === card.id);
      if (i >= 0) list[i] = card;
      else list.unshift(card);  // 최신이 위
      storage.gallerySaveAll(list);
      return true;
    } catch (e) { console.warn('[storage.galleryAddCard]', e); return false; }
  },
  galleryGetCard(id) {
    return storage.galleryLoad().find(c => c.id === id) || null;
  },
  galleryIncBuildCount(id) {
    try {
      const list = storage.galleryLoad();
      const c = list.find(x => x.id === id);
      if (c) {
        c.buildCount = (c.buildCount || 0) + 1;
        c.lastBuildAt = Date.now();
        storage.gallerySaveAll(list);
      }
    } catch (e) {}
  },
  
  // v0.7: 게임 HTML 코드를 카드에 첨부
  galleryAttachGameHtml(id, gameHtml) {
    try {
      const list = storage.galleryLoad();
      const c = list.find(x => x.id === id);
      if (c) {
        c.gameHtml = gameHtml;
        c.gameHtmlSize = gameHtml.length;
        c.gameAttachedAt = Date.now();
        storage.gallerySaveAll(list);
        return true;
      }
      return false;
    } catch (e) { console.warn('[storage.galleryAttachGameHtml]', e); return false; }
  },
  
  // v0.9.4: 게임 HTML 코드만 제거 (카드는 유지)
  galleryRemoveGameHtml(id) {
    try {
      const list = storage.galleryLoad();
      const c = list.find(x => x.id === id);
      if (c) {
        delete c.gameHtml;
        delete c.gameHtmlSize;
        delete c.gameAttachedAt;
        storage.gallerySaveAll(list);
        return true;
      }
      return false;
    } catch (e) { return false; }
  },
  
  // v0.9.4: 카드 메타 업데이트 (제목, 이모지, 요약)
  galleryUpdateCard(id, updates) {
    try {
      const list = storage.galleryLoad();
      const c = list.find(x => x.id === id);
      if (!c) return false;
      // 허용 필드만 업데이트 (보안)
      const ALLOWED = ['title', 'emoji', 'summary', 'genre'];
      for (const key of ALLOWED) {
        if (updates[key] !== undefined) c[key] = updates[key];
      }
      c.updatedAt = Date.now();
      storage.gallerySaveAll(list);
      return true;
    } catch (e) { return false; }
  },
  
  // v0.9.4: 카드 삭제
  galleryDeleteCard(id) {
    try {
      const list = storage.galleryLoad();
      const filtered = list.filter(x => x.id !== id);
      if (filtered.length === list.length) return false; // 못 찾음
      storage.gallerySaveAll(filtered);
      return true;
    } catch (e) { return false; }
  },

  // ===== BYOK 키 관리 (v0.9) =====
  byokSaveKey(key) {
    try {
      // 간단한 obfuscation (보안 X, 우연한 노출 방지용)
      const encoded = btoa(unescape(encodeURIComponent(key)));
      localStorage.setItem(CONFIG.STORAGE.apiKeyKey, encoded);
      return true;
    } catch (e) { console.warn('[storage.byokSaveKey]', e); return false; }
  },
  byokLoadKey() {
    try {
      const r = localStorage.getItem(CONFIG.STORAGE.apiKeyKey);
      if (!r) return '';
      return decodeURIComponent(escape(atob(r)));
    } catch (e) { return ''; }
  },
  byokClearKey() {
    try {
      localStorage.removeItem(CONFIG.STORAGE.apiKeyKey);
      return true;
    } catch (e) { return false; }
  },
  byokHasKey() {
    return !!storage.byokLoadKey();
  },
  
  migrate() {
    try {
      const list = storage.loadAll();
      let m = false;
      list.forEach(p => {
        if (!p.schemaVersion || p.schemaVersion < 2) {
          p.schemaVersion = 2;
          if (!p.gameType) p.gameType = 'edu_quiz';
          m = true;
        }
        if (p.schemaVersion < 3) {
          p.schemaVersion = 3;
          if (!p.mode) p.mode = 'standard';
          if (!p.proForm) p.proForm = {};
          m = true;
        }
        if (p.schemaVersion < 4) {
          if (p.mode === 'quick') p.mode = 'surprise';
          if (p.mode === 'guided') p.mode = 'standard';
          if (p.mode === 'pro') p.mode = 'detailed';
          p.schemaVersion = 4;
          m = true;
        }
        if (p.schemaVersion < 5) {
          p.schemaVersion = 5;
          m = true;
        }
        if (p.schemaVersion < 6) {
          p.schemaVersion = 6;
          m = true;
        }
        if (p.schemaVersion < 7) {
          p.schemaVersion = 7;
          m = true;
        }
      });
      if (m) localStorage.setItem(CONFIG.STORAGE.key, JSON.stringify(list));
      
      // v0.6 갤러리 시드: 비어있으면 DEMO_GAMES 자동 시드
      const gallery = storage.galleryLoad();
      if (gallery.length === 0) {
        storage.gallerySaveAll(CONFIG.DEMO_GAMES.slice());
      }
    } catch (e) { console.warn('[storage.migrate]', e); }
  }
};

// ===== RECOMMEND =====
const recommend = {
  forIdea(idea) {
    if (!idea || !idea.trim()) {
      return { type: null, confidence: 'none', shouldShowAll: true };
    }
    const text = idea.toLowerCase();
    const scores = {};
    Object.values(CONFIG.GAME_TYPES).forEach(g => {
      let s = 0;
      g.keywords.forEach(k => { if (text.includes(k.toLowerCase())) s++; });
      scores[g.id] = s;
    });
    let topId = null, topScore = 0;
    Object.entries(scores).forEach(([id, s]) => { if (s > topScore) { topScore = s; topId = id; } });
    if (topScore === 0) return { type: null, confidence: 'none', shouldShowAll: true };
    return {
      type: topId,
      confidence: topScore >= CONFIG.MATCH_STRONG ? 'strong' : 'weak',
      shouldShowAll: false,
      score: topScore
    };
  }
};

// ===== ANSWERS DEFAULTS =====
const answers = {
  defaultsFor(gameType) {
    const out = {};
    const qs = CONFIG.QUESTIONS_BY_GENRE[gameType] || [];
    qs.forEach(q => {
      const def = q.options.find(o => o.d);
      out[q.key] = def ? def.v : q.options[0].v;
    });
    return out;
  },
  resetForGenre(gameType) {
    state.project.gameType = gameType;
    state.project.answers = answers.defaultsFor(gameType);
  }
};

function shareScore(score) {
  // 1. Canvas로 카드 이미지 생성

  canvas.width = 600; canvas.height = 400;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,600,400);
  grad.addColorStop(0,'#1A73E8'); grad.addColorStop(1,'#4F46E5');
  ctx.fillStyle = grad; ctx.fillRect(0,0,600,400);
  // 텍스트

  ctx.textAlign = 'center';
  ctx.fillText('${specObj.meta.name || '내 게임'}', 300, 100);
  ctx.font = 'bold 72px sans-serif';
  ctx.fillText(score + '점', 300, 220);
  ctx.font = '20px sans-serif';
  ctx.fillText(new Date().toLocaleDateString('ko-KR'), 300, 280);
  ctx.font = '16px sans-serif';
  ctx.fillText('Game Factory에서 만든 게임', 300, 350);
  
  // 2. 공유 시도
  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'score.png', { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: '${specObj.meta.name || '내 게임'} 점수 자랑',
          text: '${specObj.meta.name || '내 게임'} ' + score + '점!'
        });
        return;
      } catch (e) { /* fallback */ }
    }
    // fallback: 다운로드
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'score-' + score + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
}

const clipboard = {
  async copy(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text); return true;
      }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  },
  download(text, filename) {
    try {
      const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {}
  }
};

let _sbClient = null;
const sb = {
  // Supabase 클라이언트 (지연 초기화)
  get client() {
    if (!_sbClient) {
      const url = CONFIG.SUPABASE_URL;
      const key = CONFIG.SUPABASE_ANON_KEY;
      if (!url || url.includes('YOUR_PROJECT') || !key || key.includes('YOUR_ANON')) {
        return null; // 미설정
      }
      if (typeof window.supabase !== 'undefined') {
        _sbClient = window.supabase.createClient(url, key, {
          auth: { persistSession: true, autoRefreshToken: true }
        });
      }
    }
    return _sbClient;
  },
  get isConfigured() { return this.client !== null; },
  get isFileProtocol() { return location.protocol === 'file:'; },
  get user() { return sbAuth.currentUser; }
};

// ===== AUTH (v1.0) =====
const sbAuth = {
  currentUser: null,
  profile: null,
  unreadCount: 0,
  
  async init() {
    if (!sb.isConfigured) return;
    const { data: { session } } = await sb.client.auth.getSession();
    if (session?.user) {
      sbAuth.currentUser = session.user;
      await sbAuth.loadProfile();
    }
    sb.client.auth.onAuthStateChange(async (event, session) => {
      sbAuth.currentUser = session?.user || null;
      if (sbAuth.currentUser) {
        await sbAuth.loadProfile();
        sbAuth.startRealtimeNotif();
      } else {
        sbAuth.profile = null;
      }
      sbAuth.updateHeaderUI();
    });
  },
  
  async loadProfile() {
    if (!sbAuth.currentUser) return;
    const { data } = await sb.client
      .from('profiles')
      .select('*')
      .eq('id', sbAuth.currentUser.id)
      .single();
    sbAuth.profile = data;
    // 읽지 않은 알림 수
    const { count } = await sb.client
      .from('notifications')
      .select('*', { count: 'exact', head: true })
      .eq('user_id', sbAuth.currentUser.id)
      .eq('is_read', false);
    sbAuth.unreadCount = count || 0;
    sbAuth.updateHeaderUI();
  },
  
  updateHeaderUI() {
    const badge = document.getElementById('notif-badge');
    const feedBtn = document.getElementById('gf-feed-btn');
    if (!badge) return;
    if (sbAuth.unreadCount > 0) {
      badge.textContent = sbAuth.unreadCount > 9 ? '9+' : sbAuth.unreadCount;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
    if (feedBtn) {
      feedBtn.style.display = sbAuth.currentUser ? 'flex' : 'none';
    }
  },
  
  async signInWithGoogle() {
    if (!sb.isConfigured) return { error: 'Supabase 미설정' };
    const { error } = await sb.client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.href }
    });
    return { error };
  },
  
  async signInWithEmail(email, password) {
    if (!sb.isConfigured) return { error: 'Supabase 미설정' };
    const { data, error } = await sb.client.auth.signInWithPassword({ email, password });
    return { data, error };
  },
  
  async signUpWithEmail(email, password, displayName) {
    if (!sb.isConfigured) return { error: 'Supabase 미설정' };
    const username = 'maker_' + Math.random().toString(36).slice(2, 8);
    const { data, error } = await sb.client.auth.signUp({
      email, password,
      options: { data: { display_name: displayName || email, username } }
    });
    return { data, error };
  },
  
  async signOut() {
    if (!sb.isConfigured) return;
    await sb.client.auth.signOut();
    sbAuth.currentUser = null;
    sbAuth.profile = null;
    router.go('gallery');
  },
  
  // Realtime 알림 구독
  startRealtimeNotif() {
    if (!sb.isConfigured || !sbAuth.currentUser) return;
    sb.client
      .channel('notif_' + sbAuth.currentUser.id)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'notifications',
        filter: `user_id=eq.${sbAuth.currentUser.id}`
      }, () => {
        sbAuth.unreadCount++;
        sbAuth.updateHeaderUI();
        ui.toast('🔔 새 알림이 있어요!');
      })
      .subscribe();
  }
};

// ===== SHARING (v0.9.2 URL Hash 게임 공유) =====
const sharing = {
  // 게임 데이터 → URL hash로 압축
  // 형식: #/play/v1/[encoded]
  // payload: { t: title, s: summary, e: emoji, h: gameHtml }
  encodeGame(card) {
    if (!card || !card.gameHtml) return null;
    const payload = {
      t: card.title || 'My Game',
      s: card.summary || '',
      e: card.emoji || '🎮',
      h: card.gameHtml,
      v: 1  // 버전
    };
    try {
      const json = JSON.stringify(payload);
      const compressed = LZString.compressToEncodedURIComponent(json);
      return compressed;
    } catch (e) {
      console.warn('[sharing.encodeGame]', e);
      return null;
    }
  },
  
  // URL hash → 게임 데이터 복원
  decodeGame(encoded) {
    if (!encoded) return null;
    try {
      const json = LZString.decompressFromEncodedURIComponent(encoded);
      if (!json) return null;
      const payload = JSON.parse(json);
      if (!payload || !payload.h) return null;
      return {
        title: payload.t || 'Shared Game',
        summary: payload.s || '',
        emoji: payload.e || '🎮',
        gameHtml: payload.h,
        version: payload.v || 1,
        isShared: true,
        receivedAt: Date.now()
      };
    } catch (e) {
      console.warn('[sharing.decodeGame]', e);
      return null;
    }
  },
  
  // 현재 페이지 URL + hash로 공유 URL 생성
  buildShareUrl(card) {
    const encoded = sharing.encodeGame(card);
    if (!encoded) return null;
    // 현재 origin + pathname (file://도 지원)
    const base = location.origin === 'null' || location.protocol === 'file:'
      ? (location.protocol + '//' + location.host + location.pathname)
      : (location.origin + location.pathname);
    return base + '#/play/v1/' + encoded;
  },
  
  // 페이지 진입 시 hash 감지 → 공유받은 게임 자동 로드
  // 반환: 게임 카드 객체 또는 null
  getSharedGameFromHash() {
    const hash = location.hash || '';
    const m = hash.match(/^#\/play\/v(\d+)\/(.+)$/);
    if (!m) return null;
    const version = parseInt(m[1], 10);
    const encoded = m[2];
    if (version !== 1) {
      console.warn('[sharing] 지원되지 않는 공유 버전:', version);
      return null;
    }
    return sharing.decodeGame(encoded);
  },
  
  // 주소창에서 hash 제거 (공유받은 게임 닫을 때)
  clearHash() {
    if (location.hash) {
      try {
        history.replaceState(null, '', location.pathname + location.search);
      } catch (e) {
        location.hash = '';
      }
    }
  },
  
  // 공유 메시지 포맷 (링크 포함)
  formatShareMessage(card, url) {
    const lines = [
      `🎮 ${card.title || 'My Game'} - 내가 만든 게임이야!`,
    ];
    if (card.summary) lines.push(card.summary);
    lines.push('');
    lines.push('👇 클릭해서 바로 플레이');
    lines.push(url);
    lines.push('');
    lines.push('#GameFactory #AI게임');
    return lines.join('\n');
  }
};

// ===== ANTHROPIC API (v0.9 BYOK) =====
const anthropic = {
  // Claude API 호출 (스트리밍)
  // onChunk(text): 청크가 올 때마다 호출
  // onProgress(percent): 진행률 (추정)
  async build(promptText, opts = {}) {
    const { onChunk, onProgress, model = 'claude-sonnet-4-5-20250929' } = opts;
    
    const apiKey = storage.byokLoadKey();
    if (!apiKey) {
      throw new Error('NO_API_KEY');
    }
    if (!apiKey.startsWith('sk-ant-')) {
      throw new Error('INVALID_KEY_FORMAT');
    }
    
    const url = 'https://api.anthropic.com/v1/messages';
    const body = {
      model,
      max_tokens: 16000,
      stream: true,
      messages: [
        { role: 'user', content: promptText }
      ]
    };
    
    let response;
    try {
      response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body)
      });
    } catch (e) {
      throw new Error('NETWORK_ERROR: ' + e.message);
    }
    
    if (!response.ok) {
      let errorBody = '';
      try { errorBody = await response.text(); } catch (e) {}
      if (response.status === 401) throw new Error('UNAUTHORIZED: API 키가 잘못됐거나 만료됐어요');
      if (response.status === 429) throw new Error('RATE_LIMIT: 잠시 후 다시 시도해주세요');
      if (response.status >= 500) throw new Error('SERVER_ERROR: Anthropic 서버 문제. 잠시 후 다시.');
      throw new Error('API_ERROR_' + response.status + ': ' + errorBody.slice(0, 200));
    }
    
    // 스트리밍 응답 처리
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';
    
    // 진행률 추정용 (16000 토큰 max, 1토큰당 약 4바이트)
    const estimatedMaxBytes = 16000 * 4;
    let receivedBytes = 0;
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      const chunk = decoder.decode(value, { stream: true });
      buffer += chunk;
      receivedBytes += chunk.length;
      
      // SSE 이벤트 파싱
      const lines = buffer.split('\n');
      buffer = lines.pop() || ''; // 마지막 불완전 라인 보관
      
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const event = JSON.parse(data);
          if (event.type === 'content_block_delta' && event.delta && event.delta.text) {
            fullText += event.delta.text;
            if (onChunk) onChunk(event.delta.text, fullText);
          }
        } catch (e) { /* 파싱 실패 무시 */ }
      }
      
      // 진행률 추정
      if (onProgress) {
        const pct = Math.min(95, Math.floor((receivedBytes / estimatedMaxBytes) * 100));
        onProgress(pct);
      }
    }
    
    if (onProgress) onProgress(100);
    return fullText;
  },
  
  // 응답에서 HTML 코드 추출
  extractHtml(text) {
    if (!text) return '';
    // ```html ... ``` 블록 찾기
    const codeBlockMatch = text.match(/```(?:html)?\s*([\s\S]*?)```/);
    if (codeBlockMatch) {
      const code = codeBlockMatch[1].trim();
      if (code.includes('<') && (code.includes('html') || code.includes('<!DOCTYPE'))) {
        return code;
      }
    }
    // 코드 블록 없으면 <!DOCTYPE 또는 <html 부터 </html> 까지
    const doctypeMatch = text.match(/(<!DOCTYPE[\s\S]*?<\/html>)/i);
    if (doctypeMatch) return doctypeMatch[1];
    const htmlMatch = text.match(/(<html[\s\S]*?<\/html>)/i);
    if (htmlMatch) return htmlMatch[1];
    return '';
  },
  
  // API 키 검증 (간단 호출)
  async verifyKey(apiKey) {
    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 10,
          messages: [{ role: 'user', content: 'hi' }]
        })
      });
      if (response.status === 401) return { ok: false, error: 'API 키가 잘못됐어요' };
      if (response.status === 429) return { ok: true, warning: 'rate limit (키는 정상)' };
      if (!response.ok) return { ok: false, error: 'HTTP ' + response.status };
      return { ok: true };
    } catch (e) {
      return { ok: false, error: '네트워크 오류: ' + e.message };
    }
  }
};


const router = {
  go(screen) {
    if (screen === 'gallery' || screen === 'mode') {
      state.history.push(screen);
      state.screen = screen;
      ui.render(screen);
      return;
    }
    if (!router.canAdvance(state.screen, screen)) { return; }
    state.history.push(screen);
    state.screen = screen;
    ui.render(screen);
  },
  flowFor(mode) {
    if (mode === 'surprise') {
      return ['mode', 'genre', 'preview', 'spec', 'handoff'];
    }
    return ['mode', 'idea', 'genre', 'questions', 'preview', 'spec', 'handoff'];
  },
  canAdvance(from, to) {
    if (to === 'gallery' || to === 'mode') return true;
    if (to === 'upgrade' && from === 'gallery') return true;
    if (to === 'spec' && from === 'upgrade') return true;
    if (to === 'detail' && from === 'preview') return true;
    if (to === 'preview' && from === 'detail') return true;
    if (to === 'import') return true;
    if (to === 'play') return true;
    if (to === 'settings') return true;
    if (to === 'ai-build') return true;
    // v1.0: 어디서든 진입 가능한 화면
    if (to === 'auth') return true;
    if (to === 'profile') return true;
    if (to === 'feed') return true;
    if (to === 'user') return true;
    if (to === 'leaderboard') return true;
    if (to === 'notifications') return true;
    const flow = router.flowFor(state.project.mode);
    const f = flow.indexOf(from), t = flow.indexOf(to);
    if (f === -1 || t === -1) return false;
    return t === f + 1;
  },
  goBack() {
    const flow = router.flowFor(state.project.mode);
    const f = flow.indexOf(state.screen);
    if (f > 0) {
      const prev = flow[f - 1];
      state.screen = prev;
      ui.render(prev);
    }
  }
};

          </div>

          <div style="margin-top:10px;">
            <button class="gf-btn-primary" id="btn-goto-login" style="padding:8px 16px;font-size:13px;width:100%;">

    main.querySelectorAll('.gf-game-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-action]')) return;
        const cid = card.dataset.cardId;
        const c = storage.galleryGetCard(cid);
        state.currentGameCard = c;
        if (c && c.gameHtml) {
          // 코드 있으면 플레이 우선
          state.playCard = c;
          router.go('play');
        } else {
          state.upgradeChoices = [];
          router.go('upgrade');
        }
      });
    });
    // ▶ 플레이
    main.querySelectorAll('[data-action="play"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cid = btn.dataset.cardId;
        const c = storage.galleryGetCard(cid);
        if (c && c.gameHtml) {
          state.playCard = c;
          router.go('play');
        }
      });
    });
    // 📥 코드 가져오기
    main.querySelectorAll('[data-action="import"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cid = btn.dataset.cardId;
        state.importTargetCardId = cid;
        router.go('import');
      });
    });
    // ⚙ 업그레이드
    main.querySelectorAll('[data-action="upgrade"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cid = btn.dataset.cardId;
        state.currentGameCard = storage.galleryGetCard(cid);
        state.upgradeChoices = [];
        router.go('upgrade');
      });
    });
    // 📋 프롬프트 보기 (데모 카드)
    main.querySelectorAll('[data-action="prompt"]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const cid = btn.dataset.cardId;
        const c = storage.galleryGetCard(cid);
        if (c && c.prompt) {
          const ok = await clipboard.copy(c.prompt);
          ui.toast(ok ? '프롬프트 복사됨!' : '복사 실패');
        } else {
          ui.toast('이 게임은 데모예요 (프롬프트 없음)');

      });

    // v0.9.4: ⋮ 카드 메뉴
    main.querySelectorAll('[data-action="menu"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cid = btn.dataset.cardId;
        const c = storage.galleryGetCard(cid);
        if (c) ui.showCardMenu(c);
      });
    });
    // 새 게임 만들기
    document.getElementById('cta-new').addEventListener('click', () => {
      state.project = createEmptyProject();
      state.currentGameCard = null;
      router.go('mode');
    });
    // v0.9.3: 외부 게임 추가 (드래곤 버블 등 다른 채팅방에서 만든 HTML)
    const ctaImportExternal = document.getElementById('cta-import-external');
    if (ctaImportExternal) {
      ctaImportExternal.addEventListener('click', () => {
        state.importTargetCardId = null; // 새 카드 모드
        state.importExternalMode = true;  // 외부 게임 플래그
        router.go('import');
      });
    }
    // BYOK 프롬프트 카드
    const byokCard = document.getElementById('byok-prompt-card');
    if (byokCard) byokCard.addEventListener('click', () => router.go('settings'));
    
    // v1.0: 프로필 버튼
    const profileRow = document.getElementById('btn-goto-profile');
    if (profileRow) profileRow.addEventListener('click', () => router.go('profile'));
    
    // v1.0: 로그인 버튼 (file://에서는 auth 화면 → 안내 표시)
    const loginBtn = document.getElementById('btn-goto-login');
    if (loginBtn) loginBtn.addEventListener('click', () => router.go('auth'));
  },

  renderUpgrade(main, cta) {
    const card = state.currentGameCard;
    if (!card) {
      router.go('gallery');
      return;
    }
    const choices = state.upgradeChoices;

    const optionsHtml = CONFIG.UPGRADE_OPTIONS.map(opt => `
      <div class="gf-upgrade-chip${choices.includes(opt.key)?' selected':''}" data-key="${opt.key}">
        <div class="gf-chip-label">${opt.l}</div>
        <div class="gf-chip-desc">${opt.d}</div>
      </div>
    `).join('');

    main.innerHTML = `
      <div class="gf-card gf-info">
        <p class="gf-muted">⚙ 업그레이드 — 기존 게임에 변경분 추가</p>
      </div>
      <div class="gf-card gf-upgrade-target">
        <div class="gf-card-emoji" style="font-size:48px;">${card.emoji || '🎮'}</div>
        <div class="gf-card-title" style="font-size:18px;font-weight:700;margin-top:8px;">${escapeHtml(card.title)}</div>
        <div class="gf-card-summary" style="margin-top:6px;">${escapeHtml(card.summary || '')}</div>
      </div>
      <div class="gf-card">
        <h4>어떻게 업그레이드 할까요?</h4>
        <p class="gf-q-reason">▸ 여러 개 선택 가능. 선택한 변경분만 새 프롬프트에 추가됩니다.</p>
        <div class="gf-spacer-sm"></div>
        <div class="gf-upgrade-grid">
          ${optionsHtml}
        </div>
      </div>
    `;

    cta.innerHTML = `
      <button class="gf-cta-btn" id="cta-btn"${choices.length === 0?' disabled':''}>
        ${choices.length === 0 ? '옵션을 1개 이상 선택하세요' : `업그레이드 프롬프트 만들기 (${choices.length}개)`}
      </button>
    `;

    main.querySelectorAll('.gf-upgrade-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const k = chip.dataset.key;
        const i = state.upgradeChoices.indexOf(k);
        if (i >= 0) state.upgradeChoices.splice(i, 1);
        else state.upgradeChoices.push(k);
        ui.render('upgrade');
      });
    });

    document.getElementById('cta-btn').addEventListener('click', () => {
      if (choices.length === 0) return;
      // upgrade prompt 생성 → spec 화면으로
      prompt.generateUpgrade(card, choices);
      // 갤러리 빌드 카운트 증가
      storage.galleryIncBuildCount(card.id);
      router.go('spec');
    });
  },

  // v0.7+v0.9.3: Claude Artifact 코드 가져오기 (기존 카드 채우기 + 외부 게임 새 카드)
  renderImport(main, cta) {

    const card = cid ? storage.galleryGetCard(cid) : null;
    const isExternal = !card && state.importExternalMode === true;

    main.innerHTML = `
      <div class="gf-card gf-info">
        <p class="gf-muted">📥 ${isExternal ? '외부 게임을 갤러리에 추가' : '게임 코드 가져오기'}</p>

            ⚠️ 이미 코드가 있는 카드예요. 새로 붙여넣으면 <b>기존 코드는 덮어쓰여요</b>.
          </div>

      ` : ''}
      ${isExternal ? `
      <div class="gf-card">
        <h4>🎮 게임 정보</h4>
        <p class="gf-q-reason">▸ 다른 곳(다른 Claude 채팅, ChatGPT, 친구 등)에서 만든 HTML 게임을 갤러리에 추가합니다.</p>
        <div class="gf-spacer-sm"></div>
        <label style="font-size:13px;font-weight:600;color:var(--fg);">게임 제목</label>
        <input type="text" id="gf-ext-title" class="gf-input" placeholder="예: 드래곤 버블버블" maxlength="40" />
        <div class="gf-spacer-sm"></div>
        <label style="font-size:13px;font-weight:600;color:var(--fg);">이모지 (1~3개)</label>
        <input type="text" id="gf-ext-emoji" class="gf-input" placeholder="🐉🫧" maxlength="6" value="🎮" />
        <div class="gf-spacer-sm"></div>
        <label style="font-size:13px;font-weight:600;color:var(--fg);">한 줄 설명 (선택)</label>
        <input type="text" id="gf-ext-summary" class="gf-input" placeholder="예: 드래곤이 버블을 쏘는 퍼즐 게임" maxlength="80" />
      </div>
      ` : ''}
      <div class="gf-card">
        <h4>${isExternal ? '🎮 게임 HTML 코드' : '🎮 Claude에서 만든 게임 코드를 붙여넣으세요'}</h4>
        <p class="gf-q-reason">▸ 이 코드는 갤러리에 저장되어 ▶ 플레이 버튼으로 언제든 실행할 수 있어요.</p>
        <div class="gf-spacer-sm"></div>
        <textarea id="gf-import-code" class="gf-textarea" rows="10" 
          placeholder="<!DOCTYPE html>로 시작하는 전체 HTML 코드를 붙여넣으세요"
          spellcheck="false"
          style="font-family:var(--font-mono);font-size:11px;"></textarea>
        <div class="gf-spacer-sm"></div>
        <p class="gf-muted" style="font-size:12px;line-height:1.6;">
          <b>📖 코드 가져오는 방법:</b><br>
          1. ${isExternal ? '게임을 만든 곳에서' : 'Claude 채팅에서 만든 게임'} 우상단 ⋮ 메뉴 클릭<br>
          2. "코드 복사" 또는 "Copy code" 클릭<br>
          3. 위 칸에 붙여넣기 → 저장
        </p>
      </div>
    `;
    cta.innerHTML = `
      <div style="display:flex; gap:8px;">
        <button class="gf-cta-btn gf-secondary" id="cta-cancel" style="flex:1;">취소</button>
        <button class="gf-cta-btn" id="cta-save" style="flex:2;">${isExternal ? '갤러리에 추가하고 플레이' : '저장하고 플레이'}</button>
      </div>

      state.importTargetCardId = null;
      state.importExternalMode = false;
      router.go('gallery');

    document.getElementById('cta-save').addEventListener('click', () => {
      const code = document.getElementById('gf-import-code').value.trim();
      if (!code) {
        ui.toast('코드를 붙여넣어주세요');
        return;
      }
      // 간단 검증
      if (!code.includes('<') || !code.includes('html')) {
        ui.toast('올바른 HTML 코드가 아닌 것 같아요');
        return;
      }
      if (code.length > 5 * 1024 * 1024) {
        ui.toast('코드가 너무 커요 (5MB 초과)');
        return;
      }
      // 외부 게임 모드: 입력 검증
      let extTitle = '', extEmoji = '🎮', extSummary = '';
      if (isExternal) {
        extTitle = (document.getElementById('gf-ext-title').value || '').trim();

        if (!extTitle) {
          ui.toast('게임 제목을 입력해주세요');
          return;
        }
      }
      // 저장
      let targetId = state.importTargetCardId;
      if (!targetId) {
        // 새 카드로 만들기
        const newCard = {
          id: (isExternal ? 'ext_' : 'import_') + Date.now(),
          title: isExternal ? extTitle : '가져온 게임',
          genre: 'custom',
          emoji: isExternal ? extEmoji : '🎮',
          summary: isExternal ? extSummary : 'Claude에서 만들어 가져온 게임',
          isDemo: false,
          isFromUser: true,
          isExternal: isExternal,
          buildCount: 1,
          createdAt: Date.now()
        };
        storage.galleryAddCard(newCard);
        targetId = newCard.id;
      }
      const ok = storage.galleryAttachGameHtml(targetId, code);
      if (ok) {
        ui.toast(isExternal ? '✓ 갤러리에 추가됨! 바로 플레이해요 🎮' : '저장됨! 바로 플레이해보세요 🎮');
        const c = storage.galleryGetCard(targetId);
        state.playCard = c;
        state.importTargetCardId = null;
        state.importExternalMode = false;
        router.go('play');
      } else {
        ui.toast('저장 실패. 코드 크기를 확인해주세요');
      }
    });
  },

    document.getElementById('play-back').addEventListener('click', () => {
      if (isShared) {
        // 공유 게임이면 hash 정리하고 갤러리로
        sharing.clearHash();
        state.sharedGame = null;
        state.playCard = null;
        router.go('gallery');
      } else {
        state.playCard = null;
        router.go('gallery');
      }
    });
    
    // 공유 게임 → 내 갤러리에 저장
    if (isShared) {
      document.getElementById('btn-save-shared').addEventListener('click', () => {
        const newCard = {
          id: 'card_shared_' + Date.now(),
          title: card.title + ' (친구 공유)',
          genre: 'shared',
          emoji: card.emoji || '🎁',
          summary: card.summary || '친구가 공유한 게임',
          isDemo: false,
          isFromUser: false,
          isFromShared: true,
          buildCount: 0,
          createdAt: Date.now()
        };
        storage.galleryAddCard(newCard);
        storage.galleryAttachGameHtml(newCard.id, card.gameHtml);
        ui.toast('✓ 내 갤러리에 저장됨!');
        sharing.clearHash();
        state.sharedGame = null;
        state.playCard = null;
        router.go('gallery');
      });
    }
    
    // 풀스크린 토글 (Fullscreen API 사용)
    const fsBtn = document.getElementById('gf-play-fs-btn');
    const wrap = document.getElementById('gf-play-wrap');
    fsBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await wrap.requestFullscreen();
          wrap.classList.add('gf-play-fullscreen');
          fsBtn.textContent = '⛶ 닫기';
        } else {
          await document.exitFullscreen();
          wrap.classList.remove('gf-play-fullscreen');
          fsBtn.textContent = '⛶ 전체화면';
        }
      } catch (e) {
        // Fullscreen API 실패 시 단순 클래스 토글 (CSS 풀스크린)
        wrap.classList.toggle('gf-play-fullscreen');
        fsBtn.textContent = wrap.classList.contains('gf-play-fullscreen') ? '⛶ 닫기' : '⛶ 전체화면';
      }
    });
    // ESC로 풀스크린 종료 시 클래스 정리
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        wrap.classList.remove('gf-play-fullscreen');
        fsBtn.textContent = '⛶ 전체화면';
      }
    });
    
    document.getElementById('play-share').addEventListener('click', async () => {
      // v0.9.2: 게임 자체를 URL로 공유 (LZ-String 압축)
      const url = sharing.buildShareUrl(card);
      if (!url) {
        ui.toast('공유 URL 생성 실패. 게임 코드를 확인해주세요');
        return;
      }
      
      const text = sharing.formatShareMessage(card, url);
      const urlSizeKB = (url.length / 1024).toFixed(1);
      
      // 모바일에서만 navigator.share 사용
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && navigator.share) {
        try {
          await navigator.share({ title: card.title, text: text, url: url });
          return;
        } catch (e) { /* 사용자 취소 또는 미지원 */ }
      }
      // 클립보드 폴백
      const ok = await clipboard.copy(text);
      if (ok) {
        ui.toast(`✓ 게임 링크 복사됨! (${urlSizeKB}KB) 카톡에 붙여넣으세요`);
      } else {
        ui.toast('복사 실패');
      }
    });
  },

  // AI 빌드 시작 (renderAiBuild에서 호출됨)
  async startAiBuild(promptText, targetCardId) {
    state.aiBuild = {
      status: 'building',
      progress: 0,
      streamText: '',
      extractedHtml: '',
      error: null,
      startedAt: Date.now(),
      targetCardId: targetCardId
    };
    ui.render('ai-build');
    
    try {
      const result = await anthropic.build(promptText, {
        onChunk: (delta, full) => {
          state.aiBuild.streamText = full;
          // 너무 자주 렌더하지 않도록 throttle (간단)
          const streamEl = document.getElementById('ai-stream-preview');
          if (streamEl) {
            streamEl.innerHTML = `<pre>${escapeHtml(full.slice(-800))}</pre>`;
          }
        },
        onProgress: (pct) => {
          state.aiBuild.progress = pct;
          const fill = document.getElementById('ai-progress-fill');
          const text = document.getElementById('ai-progress-text');
          if (fill) fill.style.width = pct + '%';
          if (text) text.textContent = pct + '%';
        }
      });
      
      // HTML 추출
      const html = anthropic.extractHtml(result);
      if (!html) {
        state.aiBuild.status = 'error';
        state.aiBuild.error = 'Claude 응답에서 HTML 코드를 찾을 수 없어요. 다시 시도하거나 프롬프트를 확인해주세요.';
        ui.render('ai-build');
        return;
      }
      
      state.aiBuild.extractedHtml = html;
      
      // 갤러리에 게임 HTML 저장
      let cardId = targetCardId;
      if (!cardId) {
        // 새 카드 생성
        const gtInfo = CONFIG.GAME_TYPES[state.project.gameType] || { icon: '🎮', name: 'Custom' };
        const newCard = {
          id: 'card_' + (state.project.id || Date.now()),
          title: state.project.title || 'My Game',
          genre: state.project.gameType || 'custom',
          emoji: gtInfo.icon,
          summary: state.project.idea || '',
          isDemo: false,
          isFromUser: true,
          buildCount: 1,
          createdAt: Date.now(),
          prompt: promptText
        };
        storage.galleryAddCard(newCard);
        cardId = newCard.id;
        state.aiBuild.targetCardId = cardId;
      }
      storage.galleryAttachGameHtml(cardId, html);
      storage.galleryIncBuildCount(cardId);
      
      state.aiBuild.status = 'success';
      state.aiBuild.progress = 100;
      ui.render('ai-build');
    } catch (e) {
      state.aiBuild.status = 'error';
      const msg = String(e.message || e);
      let userMsg = msg;
      if (msg.includes('NO_API_KEY')) userMsg = 'API 키가 없어요. 설정 화면에서 등록해주세요.';
      else if (msg.includes('UNAUTHORIZED')) userMsg = 'API 키가 잘못됐어요. 설정에서 다시 확인해주세요.';
      else if (msg.includes('RATE_LIMIT')) userMsg = '잠시 후 다시 시도해주세요 (Anthropic 사용량 한도)';
      else if (msg.includes('NETWORK')) userMsg = '인터넷 연결을 확인해주세요';
      else if (msg.includes('SERVER_ERROR')) userMsg = 'Anthropic 서버 일시적 문제. 잠시 후 다시 시도.';
      state.aiBuild.error = userMsg;
      ui.render('ai-build');
    }
  },

            </div>
          </button>
        ` : `
          <button class="gf-modal-action" data-act="${isDemo ? 'upgrade' : 'replace-code'}">
            <span class="gf-modal-action-icon">📥</span>
            <div style="flex:1;"><div class="gf-modal-action-label">${isDemo ? '업그레이드 (프롬프트 만들기)' : '게임 코드 가져오기'}</div></div>
          </button>
        `}
        <button class="gf-modal-action" data-act="edit">
          <span class="gf-modal-action-icon">✏️</span>
          <div style="flex:1;">
            <div class="gf-modal-action-label">제목/이모지/설명 수정</div>
          </div>
        </button>
        ${!isDemo ? `
          <button class="gf-modal-action" data-act="toggle-public">
            <span class="gf-modal-action-icon">${card.isPublic ? '🔒' : '🌐'}</span>
            <div style="flex:1;">
              <div class="gf-modal-action-label">${card.isPublic ? '비공개로 변경' : '전체 공개로 변경'}</div>
              <div class="gf-modal-action-desc">${card.isPublic ? '피드에서 숨겨져요' : '피드에 공개돼서 모든 사람이 볼 수 있어요'}</div>
            </div>
          </button>
        ` : ''}
        ${!isDemo ? `
          <button class="gf-modal-action gf-danger" data-act="delete">
            <span class="gf-modal-action-icon">🗑</span>
            <div style="flex:1;">
              <div class="gf-modal-action-label">카드 삭제</div>
              <div class="gf-modal-action-desc">갤러리에서 영구 제거</div>
            </div>
          </button>
        ` : ''}
        <button class="gf-modal-cancel">닫기</button>

    `;

    const close = () => overlay.remove();
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) close();
    });

    overlay.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const act = btn.dataset.act;

            router.go('play');

            ui.toast(ok ? '✓ 게임 링크 복사됨!' : '복사 실패');
            break;
          }
          case 'replace-code': {
            // 기존 카드의 코드 덮어쓰기 모드로 import 진입
            state.importTargetCardId = card.id;
            state.importExternalMode = false;
            router.go('import');
            break;
          }
          case 'remove-code': {
            if (confirm(`"${card.title}" 의 게임 코드를 비울까요?\n카드는 유지됩니다.`)) {
              storage.galleryRemoveGameHtml(card.id);
              ui.toast('✓ 코드 비워짐. 다시 가져올 수 있어요');
              router.go('gallery');
            }
            break;
          }
          case 'upgrade': {
            state.currentGameCard = card;
            state.upgradeChoices = [];
            router.go('upgrade');
            break;
          }
          case 'toggle-public': {
            const newPublic = !card.isPublic;
            // localStorage 업데이트
            storage.galleryUpdateCard(card.id, { isPublic: newPublic });
            // Supabase 동기화 (sbGameId 있으면)
            if (card.sbGameId && sb.isConfigured) {
              sbGames.update(card.sbGameId, { is_public: newPublic });
            }
            ui.toast(newPublic ? '🌐 피드에 공개됐어요!' : '🔒 비공개로 변경됐어요');
            router.go('gallery');
            break;
          }
          case 'edit': {
            ui.showEditCardModal(card);
            break;
          }
          case 'delete': {
            if (confirm(`"${card.title}" 카드를 정말 삭제할까요?\n게임 코드와 함께 영구 삭제됩니다.`)) {
              storage.galleryDeleteCard(card.id);
              ui.toast('✓ 카드 삭제됨');
              router.go('gallery');
            }
            break;
          }
        }
      });
    });
  },

  showEditCardModal(card) {
    const overlay = document.createElement('div');
    overlay.className = 'gf-modal-backdrop';
    overlay.innerHTML = `
      <div class="gf-modal" role="dialog" aria-label="카드 수정">
        <div class="gf-modal-title">
          <span class="gf-modal-title-emoji">✏️</span>
          <span>카드 정보 수정</span>
        </div>
        <label style="font-size:13px;font-weight:600;color:var(--fg);">제목</label>
        <input type="text" id="gf-edit-title" class="gf-input" maxlength="40" value="${escapeHtml(card.title || '')}" />
        <div class="gf-spacer-sm"></div>
        <label style="font-size:13px;font-weight:600;color:var(--fg);">이모지</label>
        <input type="text" id="gf-edit-emoji" class="gf-input" maxlength="6" value="${escapeHtml(card.emoji || '🎮')}" />
        <div class="gf-spacer-sm"></div>
        <label style="font-size:13px;font-weight:600;color:var(--fg);">한 줄 설명</label>
        <input type="text" id="gf-edit-summary" class="gf-input" maxlength="80" value="${escapeHtml(card.summary || '')}" />
        <div class="gf-spacer-sm"></div>
        <div style="display:flex;gap:8px;margin-top:6px;">
          <button class="gf-cta-btn gf-secondary" id="gf-edit-cancel" style="flex:1;">취소</button>
          <button class="gf-cta-btn" id="gf-edit-save" style="flex:2;">저장</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    
    const close = () => overlay.remove();
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) close();
    });
    overlay.querySelector('#gf-edit-cancel').addEventListener('click', close);
    overlay.querySelector('#gf-edit-save').addEventListener('click', () => {
      const title = (overlay.querySelector('#gf-edit-title').value || '').trim();
      const emoji = (overlay.querySelector('#gf-edit-emoji').value || '').trim() || '🎮';
      const summary = (overlay.querySelector('#gf-edit-summary').value || '').trim();
      if (!title) { ui.toast('제목을 입력해주세요'); return; }
      const ok = storage.galleryUpdateCard(card.id, { title, emoji, summary });
      if (ok) {
        ui.toast('✓ 수정됨');
        close();
        router.go('gallery');
      } else {
        ui.toast('수정 실패');
      }
    });
    // 첫 입력에 포커스
    setTimeout(() => overlay.querySelector('#gf-edit-title').focus(), 50);
  },

  // Preview용 6줄 요약 생성
  buildLiteSummary() {
    const p = state.project;
    const gt = p.gameType;
    const a = p.answers;
    const gtInfo = CONFIG.GAME_TYPES[gt];

    // 게임명 (없으면 idea에서 추출 또는 기본)
    if (!p.title) {
      const idea = p.idea;
      p.title = idea && idea.trim() ? idea.trim().slice(0, 20) : (gtInfo.name + ' 게임');
    }

    // 장르별 핵심/목표/실패/특징 6줄
    let core = '', goal = '', fail = '', feature = '';
    if (gt === 'edu_quiz') {
      const subj = (CONFIG.QUESTIONS_BY_GENRE.edu_quiz[0].options.find(o=>o.v===a.subject)||{}).l || '학습';
      core = `${subj} 4지선다 풀기`;
      goal = '10문제 정답 맞추기';
      fail = a.retry === 'true' ? '실패 없음 (다시 풀기)' : '오답 시 정답 표시';
      feature = '베스트 점수 기록';
    } else if (gt === 'one_tap_dodge') {
      const tapAct = (CONFIG.QUESTIONS_BY_GENRE.one_tap_dodge[0].options.find(o=>o.v===a.tapAction)||{}).l || '점프';
      const obs = (CONFIG.QUESTIONS_BY_GENRE.one_tap_dodge[1].options.find(o=>o.v===a.obstacle)||{}).l || '가시';
      core = `탭=${tapAct} + ${obs} 회피`;
      goal = a.scoreRule === 'survive_time' ? '오래 버티기' : a.scoreRule === 'pass_count' ? '많이 통과하기' : '아이템 모으기';
      fail = `${obs} 충돌 시 즉사`;
      feature = '단계별 가속 (10초마다 +5%)';
    } else if (gt === 'endless_runner') {
      const act = (CONFIG.QUESTIONS_BY_GENRE.endless_runner[1].options.find(o=>o.v===a.action)||{}).l || '점프';
      core = `자동 달리기 + ${act}`;
      goal = '멀리까지 달리기';
      fail = a.failCondition === 'collision' ? '장애물 충돌 시 게임오버' : a.failCondition === 'pit_fall' ? '구멍 빠짐' : '시간 초과';
      feature = '점진 가속 (15초마다 +5%)';
    } else if (gt === 'card_matching') {
      const theme = (CONFIG.QUESTIONS_BY_GENRE.card_matching[0].options.find(o=>o.v===a.theme)||{}).l || '동물';
      core = `${theme} 카드 ${a.cardCount}장 짝 맞추기`;
      goal = `모든 ${a.cardCount/2}쌍 매칭`;
      fail = a.timeLimit === 'none' ? '실패 없음' : `${a.timeLimit}초 초과 시 실패`;
      feature = '시도 횟수 적을수록 보너스';
    } else if (gt === 'click_reaction') {
      const tgt = (CONFIG.QUESTIONS_BY_GENRE.click_reaction[0].options.find(o=>o.v===a.target)||{}).l || '두더지';
      core = `${tgt} 빠르게 터치`;
      goal = `${a.gameTime === 'unlimited' ? '베스트 도전' : a.gameTime + '초 동안 점수 누적'}`;
      fail = a.failRule === 'wrong_tap_minus' ? '잘못 터치 시 감점' : a.failRule === 'timeout' ? '시간 종료' : '실패 없음';
      feature = '반응속도 측정';
    }

    return { title: p.title, genreName: gtInfo.icon + ' ' + gtInfo.name, core, goal, fail, feature };
  },

      const ok = await clipboard.copy(text);
      ui.toast(ok ? '복사됨' : '복사 실패');

    document.getElementById('btn-download').addEventListener('click', () => {
      clipboard.download(text, filename);
      ui.toast('다운로드 시작');
    });
    document.getElementById('cta-btn').addEventListener('click', () => {
      prompt.generate(state.project.spec);

    });
  },

  renderHandoff(main, cta) {
    const text = state.project.prompt;
    storage.save(state.project);
    
    // v0.6: 갤러리 카드 자동 저장

    const lite = state.project.spec && state.project.spec.gameplay 
      ? ui.buildLiteSummary()

    const card = {
      id: state.project.upgradeFromId 
        ? state.project.upgradeFromId  // upgrade는 같은 카드 갱신
        : 'card_' + state.project.id,
      title: state.project.title || 'My Game',
      genre: gt || 'custom',
      emoji: gtInfo.icon,
      summary: lite.core || state.project.idea || '',

      isFromUser: true,
      buildCount: state.project.upgradeFromId 
        ? ((storage.galleryGetCard(state.project.upgradeFromId) || {}).buildCount || 1)

    };
    storage.galleryAddCard(card);

    const modeInfo = CONFIG.MODES[state.project.mode] || { icon: '🎮', name: 'Mode' };

    main.innerHTML = `
      <div class="gf-card gf-highlight">
        <h3>🚀 빌드 준비 완료</h3>
        <p>${modeInfo.icon} ${modeInfo.name} · ${gtInfo.icon} ${gtInfo.name}</p>
        <p style="margin-top:8px;">${hasKey 
          ? '🎯 <b>API 키가 있어요!</b> 아래 버튼으로 GF 안에서 바로 빌드하거나, Claude 채팅에 붙여넣으세요.' 
          : '아래 프롬프트를 복사해 <b>Claude 채팅 새 창</b>에 붙여넣으세요.'}</p>
        <p class="gf-muted" style="margin-top:6px;">✓ 갤러리에 자동 저장되었어요</p>
      </div>
      ${hasKey ? `
        <div class="gf-actions" style="margin-top:0;">
          <button class="gf-btn-primary gf-large" id="btn-ai-build" style="width:100%;background:linear-gradient(135deg,#1A73E8,#4F46E5);">
            🚀 GF 안에서 바로 빌드 (AI)

        <div class="gf-card gf-info" style="background:#FFF8E1;border:1px solid #F9AB00;">
          <p style="font-size:13px;line-height:1.6;color:#7A5C00;">
            💡 <b>API 키를 등록하면</b> Claude 채팅 안 거치고 GF 안에서 바로 게임을 만들 수 있어요.
            <a href="#" id="link-settings" style="color:var(--accent);font-weight:600;">설정에서 키 등록 →</a>
          </p>
        </div>
      `}
      <div class="gf-card">
        <textarea class="gf-output" readonly>${escapeHtml(text)}</textarea>
      </div>
      <div class="gf-actions">
        <button class="gf-btn-primary gf-large" id="btn-copy">📋 프롬프트 복사</button>
      </div>
      <div class="gf-card gf-info">
        <h4>다음 단계</h4>
        <ol>
          <li>위 프롬프트 복사</li>
          <li>Claude 채팅 새 창 (claude.ai)</li>
          <li>붙여넣기 → 전송 → Artifact 생성</li>
          <li>Preview 탭에서 게임 확인 → 마음에 들면 코드 복사</li>
          <li>여기로 돌아와서 갤러리 카드의 <b>📥 게임 코드 가져오기</b> → 붙여넣기</li>
          <li>이제 갤러리에서 ▶ 플레이로 언제든 실행!</li>
        </ol>
      </div>
    `;
    cta.innerHTML = `
      <div style="display:flex; gap:8px;">
        <button class="gf-cta-btn gf-secondary" id="cta-import" style="flex:1;">📥 코드 가져오기</button>
        <button class="gf-cta-btn" id="cta-btn" style="flex:1;">🎮 갤러리</button>

    `;
    document.getElementById('btn-copy').addEventListener('click', async () => {

    });
    if (hasKey) {
      document.getElementById('btn-ai-build').addEventListener('click', () => {

    } else {

      if (linkSettings) {

    document.getElementById('cta-import').addEventListener('click', () => {
      state.importTargetCardId = card.id;
      router.go('import');
    });
    document.getElementById('cta-btn').addEventListener('click', () => {
      state.project = createEmptyProject();
      state.currentGameCard = null;
      state.upgradeChoices = [];

      router.go('gallery');

  },

  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(ui._tt);
    ui._tt = setTimeout(() => el.classList.remove('show'), 1800);
  }
};

// ===== UTIL =====
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function slugify(s) {
  return String(s || 'spec').trim().toLowerCase()
    .replace(/[^a-z0-9가-힣\-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30) || 'spec';
}

function formatRelativeTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '방금';
  if (mins < 60) return mins + '분 전';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '시간 전';
  const days = Math.floor(hours / 24);
  if (days < 7) return days + '일 전';
  const d = new Date(ts);
  return (d.getMonth()+1) + '/' + d.getDate();
}

window.GF = { CONFIG, state, storage, recommend, answers, spec, prompt, router, ui, anthropic, sharing, LZString, sb, sbAuth, sbGames };

// ===== INIT =====
function init() {
  storage.migrate();
  
  // v1.0: Supabase 초기화
  sbAuth.init().then(() => sbAuth.updateHeaderUI());
  
  // 홈 버튼
  const homeBtn = document.getElementById('gf-home-btn');
  if (homeBtn) homeBtn.addEventListener('click', () => {
    state.project = createEmptyProject();
    state.currentGameCard = null;
    state.upgradeChoices = [];
    state.history = ['gallery'];
    state.sharedGame = null;
    sharing.clearHash();
    router.go('gallery');
  });
  
  // 설정 버튼
  const settingsBtn = document.getElementById('gf-settings-btn');
  if (settingsBtn) settingsBtn.addEventListener('click', () => router.go('settings'));
  
  // v1.0: 피드 버튼
  const feedBtn = document.getElementById('gf-feed-btn');
  if (feedBtn) feedBtn.addEventListener('click', () => {
    if (sbAuth.currentUser) router.go('feed');
    else router.go('auth');
  });
  
  // v1.0: 알림 버튼
  const notifBtn = document.getElementById('gf-notif-btn');
  if (notifBtn) notifBtn.addEventListener('click', () => {
    if (sbAuth.currentUser) router.go('notifications');
    else router.go('auth');
  });
  
  // v0.9.2: URL hash로 공유 받은 게임 진입
  const sharedGame = sharing.getSharedGameFromHash();
  if (sharedGame) {
    state.sharedGame = sharedGame;
    state.playCard = {
      id: 'shared_' + Date.now(),
      title: sharedGame.title,
      summary: sharedGame.summary,
      emoji: sharedGame.emoji,
      gameHtml: sharedGame.gameHtml,
      buildCount: 0,
      isShared: true
    };
    router.go('play');
    return;
  }
  
  router.go('gallery');
}
document.addEventListener('DOMContentLoaded', init);
